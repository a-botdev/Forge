<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{projectName}} — ${{ticker}} Alpha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        min-width: 320px;
        background: radial-gradient(circle at top, rgba(127, 90, 240, 0.4), rgba(15, 23, 42, 0.95));
        color: #f8fafc;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      header img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        border: 2px solid rgba(248, 210, 16, 0.8);
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
      }
      .ticker {
        font-weight: 600;
        color: #2cb67d;
      }
      p {
        margin: 12px 0;
        line-height: 1.4;
      }
      .cta {
        display: block;
        text-align: center;
        background: linear-gradient(120deg, #2cb67d, #7f5af0);
        color: #0f172a;
        font-weight: 700;
        padding: 12px;
        border-radius: 999px;
        text-decoration: none;
        margin-top: 16px;
      }
      .social {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      .social a {
        color: #f8fafc;
        text-decoration: none;
        font-size: 0.9rem;
        opacity: 0.85;
      }
      footer {
        margin-top: 16px;
        font-size: 0.75rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="{{heroThumb}}" alt="{{heroAlt}}" />
      <div>
        <h1>{{projectName}}</h1>
        <div class="ticker">${{ticker}}</div>
      </div>
    </header>
    <p>{{hook}}</p>
    <p>{{ctaBlurb}}</p>
    <a class="cta" href="{{mintUrl}}" target="_blank" rel="noopener noreferrer">Mint ${{ticker}} Now</a>
    <div class="social">
      <a href="{{twitterUrl}}" target="_blank" rel="noopener noreferrer">Follow on X</a>
      <a href="{{discordUrl}}" target="_blank" rel="noopener noreferrer">Join the Horde</a>
      <a href="{{landingUrl}}" target="_blank" rel="noopener noreferrer">Visit Landing Page</a>
    </div>
    <footer>
      Powered by Forge v1.0 — built for degen speed.
    </footer>
  </body>
</html>
